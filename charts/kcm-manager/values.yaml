k0rdentVersion: "1.11.0"

managementVersion: "1.11.0"

capiTemplate: "cluster-api-1-1-15"

providers:
  - name: cluster-api-provider-k0sproject-k0smotron
    template: cluster-api-provider-k0sproject-k0smotron-1-0-32
  - name: cluster-api-provider-aws
    template: cluster-api-provider-aws-1-0-25
  - name: projectsveltos
    template: projectsveltos-1-12-1

kcmValues:
