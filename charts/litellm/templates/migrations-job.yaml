{{- $llm := index .Values "litellm-helm" }}
{{- if and $llm.enabled (not ($llm.migrationJob).enabled) }}
# Replacement for the upstream litellm-helm migrations job. Upstream's job is
# hard-wired to the v1 migration resolver (python litellm/proxy/prisma_migration.py)
# and carries only ArgoCD hook annotations, which are inert under plain Helm —
# on our clusters it ran once at first install and never again (completed Jobs
# are immutable). The destructive v1 runs that wiped LiteLLM_ProxyModelTable on
# amazeeai-us1 came from proxy pods migrating at startup; those now use the v2
# resolver via `args` in values.yaml. This job runs the same database setup
# (`litellm --skip_server_startup --use_v2_migration_resolver`) as a
# pre-upgrade hook so migrations complete BEFORE pods roll, and keeps its logs
# for a day. pre-install is deliberately omitted: the DB secret comes from this
# chart's own ExternalSecret, which cannot exist while a pre-install hook
# blocks the first install — on first install the proxy pods create the schema
# themselves (v2, via args). Renders only while the upstream job is disabled
# (litellm-helm.migrationJob.enabled=false), so re-enabling upstream never
# yields two competing jobs.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-litellm-migrations-v2
  annotations:
    helm.sh/hook: "pre-upgrade"
    helm.sh/hook-delete-policy: "before-hook-creation"
    helm.sh/hook-weight: "1"
    checksum/config: {{ toYaml $llm | sha256sum }}
spec:
  backoffLimit: 4
  # Keep finished pods for a day: upstream's 120s TTL deleted the pod (and its
  # logs) before anyone could diagnose a destructive migration run.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: prisma-migrations
          image: "{{ ($llm.image).repository | default "ghcr.io/berriai/litellm-database" }}:{{ ($llm.image).tag | default "main-stable" }}"
          command: ["litellm", "--skip_server_startup", "--use_v2_migration_resolver"]
          workingDir: "/app"
          env:
            # ponytail: only the db.useExisting layout our clusters use; add the
            # deployStandalone branch from upstream's template if ever needed.
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $llm.db.secret.name }}
                  key: {{ $llm.db.secret.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $llm.db.secret.name }}
                  key: {{ $llm.db.secret.passwordKey }}
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $llm.db.secret.name }}
                  key: {{ $llm.db.secret.endpointKey }}
            - name: DATABASE_NAME
              value: {{ $llm.db.database }}
            - name: DATABASE_URL
              value: {{ $llm.db.url | quote }}
            {{- range $key, $val := $llm.envVars }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: DISABLE_SCHEMA_UPDATE
              value: "false" # this job IS the schema update; last entry wins if a cluster sets it in envVars
{{- end }}
