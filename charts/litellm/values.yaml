host: litellm.example.com

ingress:
  annotations:
    monitoring.amazee.io/uptime: "true"

# Gateway API configuration (alternative to Ingress)
gateway:
  enabled: false # Default is still ingress
  name: default-gateway
  gatewayClassName: envoygateway
  replicas: 2  # Number of envoy proxy replicas (should match worker node count)

externalSecrets:
  enabled: false
  clusterSecretStore: external-secrets-keystore-secret-store

litellm-helm:
  enabled: true
  image:
    tag: "main-stable"
  .aws_api_key: &aws-api-key
    aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
    aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    aws_region_name: os.environ/AWS_REGION

  db:
    useExisting: true
    deployStandalone: false
    database: litellm
    url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)?sslmode=require
    secret:
      name: litellm-external-secret
      usernameKey: databaseUsername
      passwordKey: databasePassword
      endpointKey: databaseHost

  # environmentSecrets:
  #   - litellm-external-secret
  # envVars:
  #     AWS_ACCESS_KEY_ID: fillme
  #     AWS_SECRET_ACCESS_KEY: fillme
  #     AWS_REGION: fillme
  #     UI_USERNAME: admin
  #     UI_PASSWORD: fillme

  # Proxy pods run the database migration setup on every startup (the chart's
  # deployment sets no DISABLE_SCHEMA_UPDATE, and none of our values disable
  # it), and litellm defaults to the v1 migration resolver, whose
  # diff-and-force recovery can drop and recreate tables when pods contend
  # during rolling deploys or restarts — this is what wiped
  # LiteLLM_ProxyModelTable on amazeeai-us1. The flag opts every pod into the
  # v2 resolver, which never takes the destructive path. These are the chart's
  # default args plus the flag; if numWorkers is ever set it must be re-added
  # here, since an explicit `args` replaces the chart's default arg list.
  args:
    - --config
    - /etc/litellm/config.yaml
    - --use_v2_migration_resolver

  proxy_config:

    litellm_settings:
      drop_params: true

    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      store_model_in_db: true
      store_prompts_in_spend_logs: false # This should only be true for specific debugging.

  livenessProbe:
    timeoutSeconds: 3
  readinessProbe:
    timeoutSeconds: 3
  startupProbe:
    timeoutSeconds: 3
    initialDelaySeconds: 5
