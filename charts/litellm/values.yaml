host: litellm.example.com

ingress:
  annotations:
    monitoring.amazee.io/uptime: "true"

# Gateway API configuration (alternative to Ingress)
gateway:
  enabled: false # Default is still ingress
  name: default-gateway
  gatewayClassName: envoygateway
  replicas: 2  # Number of envoy proxy replicas (should match worker node count)

externalSecrets:
  enabled: false
  clusterSecretStore: external-secrets-keystore-secret-store

litellm-helm:
  enabled: true
  image:
    tag: "main-stable"
  .aws_api_key: &aws-api-key
    aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
    aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    aws_region_name: os.environ/AWS_REGION

  db:
    useExisting: true
    deployStandalone: false
    database: litellm
    url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)?sslmode=require
    secret:
      name: litellm-external-secret
      usernameKey: databaseUsername
      passwordKey: databasePassword
      endpointKey: databaseHost

  # environmentSecrets:
  #   - litellm-external-secret
  # envVars:
  #     AWS_ACCESS_KEY_ID: fillme
  #     AWS_SECRET_ACCESS_KEY: fillme
  #     AWS_REGION: fillme
  #     UI_USERNAME: admin
  #     UI_PASSWORD: fillme

  # The upstream migrations job is replaced by templates/migrations-job.yaml:
  # its entrypoint (litellm/proxy/prisma_migration.py) is pinned to the v1
  # migration resolver, whose diff-and-force recovery can drop and recreate
  # tables during rolling deploys (this wiped LiteLLM_ProxyModelTable on
  # amazeeai-us1). Our job runs the same setup with the v2 resolver. Setting
  # this back to true restores the upstream job and disables ours.
  migrationJob:
    enabled: false

  proxy_config:
    # Upstream ships two demo models (gpt-3.5-turbo, fake-openai-endpoint)
    # as its default model_list, which leaks into every cluster that does not
    # define its own. Models come from the amazee.ai model catalog (or an
    # explicit model_list in the cluster file), never from chart defaults.
    model_list: []

    litellm_settings:
      drop_params: true

    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      store_model_in_db: true
      store_prompts_in_spend_logs: false # This should only be true for specific debugging.

  livenessProbe:
    timeoutSeconds: 3
  readinessProbe:
    timeoutSeconds: 3
  startupProbe:
    timeoutSeconds: 3
    initialDelaySeconds: 5
